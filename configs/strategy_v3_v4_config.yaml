project:
  version: strategy_v3_v4_20260828
  base_config: config.yaml

data:
  raw_dir: data/raw/strategy_real_quotes
  quote_maximum_age_seconds: 10.0
  flush_every_opportunities: 10

execution:
  initial_capital: 10000000.0
  risk_budget_fraction_per_trade: 0.075
  short_risk_capital_fraction_of_notional: 0.20
  long_minimum_risk_capital_fraction_of_notional: 0.05
  risk_free_rate: 0.018
  option_commission_per_contract_side: 5.0
  option_exercise_fee_per_contract: 5.0
  futures_commission_per_contract_side: 5.0
  futures_slippage_ticks_per_trade: 1.0
  future_tick: 0.02
  maximum_portfolio_risk_fraction: 0.30

v3:
  output_dir: data/outputs/strategy_v3_real_quotes
  displayed_depth_multipliers: [1, 3]
  include_unlimited_depth_sensitivity: true

v4:
  output_dir: data/outputs/strategy_v4_direct_pnl
  minimum_model_training_rows: 60
  minimum_threshold_selection_trades: 8
  threshold_prediction_quantiles: [0.0, 0.25, 0.50, 0.60, 0.70, 0.80]
  random_seed: 20260828
  model_families: [ridge, random_forest, hist_gradient_boosting]
  displayed_depth_multipliers: [1, 3]
  include_unlimited_depth_sensitivity: true
  optimization_objectives: [sharpe, net_profit]
